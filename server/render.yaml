services:
  - type: web
    name: resume-roaster-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: LLM_MOCK
        value: false
